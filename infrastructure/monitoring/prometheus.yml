global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: lab-jmx
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
        refresh_interval: 5s
    # targets.json supplies job=kafka/cruise-control and broker_id for broker series.
    relabel_configs:
      - source_labels: [service]
        target_label: job
